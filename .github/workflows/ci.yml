name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile all Python sources
        run: python -m compileall -q kryonyx tools run.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          for f in kryonyx/web/js/*.js; do
            node --check "$f"
          done

      - name: Install test dependencies
        run: python -m pip install aiohttp aiohttp-socks ytmusicapi pytubefix Pillow 'shazamio-core>=1.1.2,<1.2'

      - name: Python regression tests
        run: python -m unittest discover -s tests

      - name: JavaScript regression tests
        run: |
          for f in tests/test_*.cjs; do
            node "$f" || exit 1
          done

      - name: Translation coverage
        run: python tools/i18n_audit.py --check
