name: Bug report
description: Something in the player does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please write in English.
  - type: input
    id: version
    attributes:
      label: Player version
      description: Settings → Data → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it
      options:
        - Installer (.exe)
        - Portable build
        - From source (python run.py)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 23H2"
    validations:
      required: true
  - type: input
    id: lang
    attributes:
      label: Interface language
      placeholder: "English"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead
      placeholder: |
        1. Open …
        2. Click …
        3. Expected … but got …
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Settings → Logs, the lines around the problem. Remove any tokens or cookies.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of --doctor
      description: Optional. Run `KryonyxMusic --doctor` (or `python run.py --doctor`) and paste the result.
      render: text
