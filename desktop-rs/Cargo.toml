[package]
name = "kryonyx-shell"
version = "0.73.0"
edition = "2021"
description = "Optional native window for Kryo: a Rust shell around the Python backend"
license = "MIT"
publish = false

[workspace]
members = [".", "core"]

[[bin]]
name = "kryonyx-shell"
path = "src/main.rs"

[dependencies]
kryonyx-shell-core = { path = "core" }
tao = "0.37"
wry = "0.57"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
