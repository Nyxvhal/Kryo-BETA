[package]
name = "kryonyx-shell-core"
version = "0.73.0"
edition = "2021"
description = "Kryonyx shell without a window: backend sidecar, bridge protocol, command line, window state"
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
# canonical paths without the \\?\ prefix: the backend gets a normal cwd
dunce = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
